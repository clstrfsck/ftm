[package]
name = "ftm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A guideline-conformant falling-block game for the terminal"
license = "MIT"
publish = false

# Versions are pinned to the minor versions in FTM.md §3. No other runtime
# dependencies may be added without amending that table.
[dependencies]
ratatui = "0.29"
crossterm = "0.28"
# `small_rng` is not a default feature; §3 names SmallRng specifically.
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
directories = "5.0"
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[profile.release]
panic = "unwind"
