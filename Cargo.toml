[package]
name = "ftm"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A guideline-conformant falling-block game for the terminal"
license = "MIT"
publish = false

# Versions are pinned to the minor versions in FTM.md §3. No other runtime
# dependencies may be added without amending that table.
[dependencies]
ratatui = "0.30"
crossterm = "0.29"
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
serde_json = "1.0"
clap = { version = "4.6", features = ["derive"] }
directories = "6.0"
anyhow = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[profile.release]
panic = "unwind"
