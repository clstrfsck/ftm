[package]
name = "ftm"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A guideline-conformant falling-block game"
license = "MIT"
publish = false
# Two binaries as of EGUI.md G2, so `cargo run` needs telling which one it
# means. The terminal front-end is the one you play.
default-run = "ftm"

# `default` is the terminal front-end, so `cargo build` and `cargo run` are
# what they always were. `--no-default-features` builds `core` and `shell`
# alone, which is the compiler holding the shell boundary the way §17.3's A10
# holds the core's (EGUI.md G2). `gui` is wired here before there is anything
# behind it, so the target and its feature gate exist from the stage that
# created them; EGUI.md G5 fills it in.
#
# Consequence to plan for: a bare `cargo test` builds only the `tui` half, so
# every Makefile command passes `--all-features`.
[features]
default = ["tui"]
tui = [
    "dep:ratatui",
    "dep:crossterm",
    "dep:directories",
    "dep:clap",
    "dep:chrono",
    "dep:anyhow",
    "rand/thread_rng",
]
gui = []

[[bin]]
name = "ftm"
required-features = ["tui"]

[[bin]]
name = "ftm-gui"
required-features = ["gui"]

# Versions are pinned to the minor versions in FTM.md §3. No other runtime
# dependencies may be added without amending that table.
#
# Since EGUI.md G3 the shell has no clock, no filesystem, no entropy and no
# calendar of its own (§3.1), so the crates that supply those are front-end
# dependencies: `directories`, `clap` and `chrono` are behind `tui` beside
# `ratatui` and `crossterm`. What is left always-on is what parses and what
# plays.
#
# `rand` is the subtle one. It stays shared, because §9.6's bag is the core's
# and `SmallRng` is its generator -- but with `default-features = false`, so no
# `getrandom` comes with it. An OS entropy source is a *capability* (F3), and
# `tui` turns it on with `rand/thread_rng`; without that, `getrandom` refuses to
# compile for `wasm32-unknown-unknown` at all, which is the whole reason the
# shell check has a target.
[dependencies]
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }
rand = { version = "0.10", default-features = false }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
serde_json = "1.0"
clap = { version = "4.6", features = ["derive"], optional = true }
directories = { version = "6.0", optional = true }
anyhow = { version = "1.0", optional = true }
thiserror = "2.0"
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "serde",
], optional = true }

[profile.release]
panic = "unwind"
