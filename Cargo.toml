[package]
name = "ftm"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A guideline-conformant falling-block game"
license = "MIT"
publish = false
# Two binaries as of EGUI.md G2, so `cargo run` needs telling which one it
# means. The terminal front-end is the one you play.
default-run = "ftm"

# `default` is the terminal front-end, so `cargo build` and `cargo run` are
# what they always were. `--no-default-features` builds `core` and `shell`
# alone, which is the compiler holding the shell boundary the way §17.3's A10
# holds the core's (EGUI.md G2). `gui` is the window front-end of GUI.md, and
# since EGUI.md G5 it has something behind it.
#
# The two front-end features overlap in four crates, and that is not an
# accident: `directories`, `clap`, `chrono` and `anyhow` are the *native*
# platform's answers to FRONTEND.md F1-F4 and §6.4, and `src/native.rs` is
# where both native binaries get them. The web build of EGUI.md G6 is `gui` on
# `wasm32-unknown-unknown`, and answers the same four with `web-sys` and
# `js-sys` instead.
#
# A feature cannot say "on this target only", so what differs between a
# desktop and a browser tab is said by *where each crate is declared* rather
# than by the feature lists below: the four native crates are optional
# dependencies of non-wasm targets only, and the web's of wasm only. `gui`
# names both sets, and each target builds the half that exists for it.
#
# Consequence to plan for: a bare `cargo test` builds only the `tui` half, so
# every Makefile command passes `--all-features`.
[features]
default = ["tui"]
tui = [
    "dep:ratatui",
    "dep:crossterm",
    "dep:directories",
    "dep:clap",
    "dep:chrono",
    "dep:anyhow",
]
gui = [
    "dep:eframe",
    "dep:egui",
    # A desktop's (src/native.rs, gui/host_native.rs, gui/cli.rs).
    "dep:directories",
    "dep:clap",
    "dep:chrono",
    "dep:anyhow",
    # A browser tab's (gui/host_web.rs, GUI.md §G8).
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "dep:js-sys",
]

[[bin]]
name = "ftm"
required-features = ["tui"]

[[bin]]
name = "ftm-gui"
required-features = ["gui"]

# Versions are pinned to the minor versions in FTM.md §3. No other runtime
# dependencies may be added without amending that table.
#
# Since EGUI.md G3 the shell has no clock, no filesystem, no entropy and no
# calendar of its own (§3.1), so the crates that supply those are front-end
# dependencies, declared per target below. What is left always-on is what
# parses and what plays.
#
# `rand` is the subtle one. It stays shared, because §9.6's bag is the core's
# and `SmallRng` is its generator -- but with `default-features = false`, so no
# `getrandom` comes with it. An OS entropy source is a *capability* (F3), and
# it is a desktop's: the non-wasm table turns it on with `thread_rng`, and
# nothing turns it on for wasm. `getrandom` refuses to compile for
# `wasm32-unknown-unknown` without a build-time `--cfg`, which is what makes
# `make portable` and `make web-check` the guard against it drifting back.
# (Until EGUI.md G6 the front-end *features* turned it on; a feature cannot
# tell a desktop from a browser tab, and `gui` is now both.)
[dependencies]
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }
# GUI.md §G1 pins these two together, and FTM.md §3 records the MSRV they set:
# 1.95, which is `egui`'s and is now the floor. `glow` rather than the default
# `wgpu` backend, because what this front-end draws is rectangles and OpenGL is
# the smaller and more widely available of the two -- and because the web build
# of EGUI.md G6 reaches WebGL2 through it without a WebGPU fallback path.
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
], optional = true }
egui = { version = "0.36", optional = true }
rand = { version = "0.10", default-features = false }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
serde_json = "1.0"
thiserror = "2.0"

# A desktop: FRONTEND.md F1-F4 and §6.4's argv, for `ftm` and native `ftm-gui`
# alike (src/native.rs). None of these means anything in a browser tab, so none
# of them is built for one, whichever features are on.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rand = { version = "0.10", default-features = false, features = ["thread_rng"] }
clap = { version = "4.6", features = ["derive"], optional = true }
directories = { version = "6.0", optional = true }
anyhow = { version = "1.0", optional = true }
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "serde",
], optional = true }

# A browser tab: the same four, for `ftm-gui` on wasm (GUI.md §G8). They are
# already in the tree under `eframe`'s web build and move with its pin (§G1.1);
# naming them here is what lets `gui/host_web.rs` ask for the `web-sys`
# interfaces it uses rather than borrowing whichever `eframe` happens to enable.
# `console_error_panic_hook` is deliberately absent: `eframe::WebRunner`
# installs a hook of its own that does the same (§G8.5).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "Location",
    "Node",
    "Performance",
    "Storage",
    "Window",
    "console",
], optional = true }

[profile.release]
panic = "unwind"
