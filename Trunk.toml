# The web build (GUI.md §G8, EGUI.md G6): `ftm-gui` compiled for
# wasm32-unknown-unknown, and `index.html` around it.
#
#   trunk serve               # http://127.0.0.1:8080, rebuilt on save
#   trunk build --release     # the artefact, in dist/
#
# What is built, and with which features, is said by `index.html`'s
# `data-trunk rel="rust"` link rather than here, because that is where trunk
# looks for it.

[build]
target = "index.html"
dist = "dist"
# Relative asset URLs, so that `dist/` works wherever it is put -- where the
# web build is served is still an open decision in EGUI.md.
public_url = "./"
